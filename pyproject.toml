[project]
name = "kalki"
version = "0.1.0"
description = "ClearIt study buddy: AI-rewritten practice questions served by an animated companion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "certifi>=2026.10.23",
    "confluent-kafka>=2.16.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
