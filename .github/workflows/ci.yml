name: Kalki CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kalki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the app starts from the image
        run: |
          docker run --rm             -e TEST_SERVICE_URL=http://test -e ATTEMPT_SERVICE_URL=http://attempt             -e PAYMENT_SERVICE_URL=http://payment -e KALKI_SERVICE_SECRET=ci             -e API_GATEWAY_SECRET=ci -e KALKI_MYSQL_PASSWORD=ci             kalki:ci python -c "import app.main"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khaansar/kalki:latest
            ghcr.io/khaansar/kalki:${{ github.sha }}
          cache-from: type=gha
